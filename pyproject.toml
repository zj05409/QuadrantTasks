[project]
name = "quadrant-tasks-web"
version = "1.2.0"
description = "Eisenhower matrix PWA with self-hosted JSON sync"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI evaluates annotations at runtime; keep typing.Optional/Dict for py3.9.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() defaults are the documented idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
